name: Publish fixed environment

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.2
      - name: Build and test image
        run: apptainer build ps.sif environment/ps.def
      - name: Publish public release image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v0.4.2 >/dev/null 2>&1 || gh release create v0.4.2 --title "Fixed environment v0.4.2" --notes "Versioned Apptainer environment for the Omnibenchmark PS module."
          gh release upload v0.4.2 ps.sif --clobber
